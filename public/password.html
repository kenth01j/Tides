<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Change password | TIDES</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="travel-app" data-role="enforcement">
  <header class="app-header"><nav class="app-nav" aria-label="Staff navigation"><a class="travel-brand" href="/">TIDES<span>.</span></a><div class="app-nav-links"><a href="/admin.html">Dashboard</a><a href="/enforcement.html">Enforcement</a><a href="/reports.html">Analytics</a></div><button class="app-nav-action" data-logout>Sign out</button></nav></header>
  <main class="container login-wrap">
    <section class="login-card"><span class="eyebrow" style="color:#088395">Account security</span><h1 class="page-title">Change password</h1><p id="password-description" class="muted">Choose a unique password with at least 10 characters.</p>
      <form id="password-form">
        <div class="field"><label for="currentPassword">Current password</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required></div>
        <div class="field" style="margin-top:1rem"><label for="newPassword">New password</label><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="10" required></div>
        <p id="password-notice" class="notice" role="status"></p><button type="submit">Update password</button>
      </form>
    </section>
  </main>
  <footer class="app-footer"><div class="app-footer-inner"><a class="travel-brand" href="/">TIDES<span>.</span></a><span>Authorized LGU portal · Tabango</span><strong>Protect the Shoal, Sustain the Future.</strong></div></footer>
  <script src="/js/auth.js"></script>
  <script>
    if (new URLSearchParams(location.search).get('required') === '1') {
      document.querySelector('#password-description').textContent = 'For security, change your temporary password before using the staff portal.';
    }
  </script>
  <script src="/js/animations.js"></script>
</body>
</html>
